apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

group = 'com.github.rayworks'
version = '3.0.0'

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    namespace 'com.rayworks.library'

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        compose = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.8"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.12'
    implementation "androidx.appcompat:appcompat:$rootProject.ext.appcompat_x"
    implementation 'androidx.core:core-ktx:1.12.0'

    implementation 'com.jakewharton.timber:timber:4.1.2'

    // Jetpack Compose BOM — pins all compose-* versions consistently. Exported (api) so
    // consumers get matching versions of the Compose types used by the public API
    // (Modifier, TextStyle, Color, PaddingValues, @Composable).
    def composeBom = platform('androidx.compose:compose-bom:2024.02.01')
    api composeBom
    api 'androidx.compose.runtime:runtime'
    api 'androidx.compose.ui:ui'
    api 'androidx.compose.ui:ui-text'
    api 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.animation:animation'

    // Instrumented Compose UI tests.
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.compose.ui:ui-test-manifest'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}

// Maven publication (used by JitPack: com.github.rayworks:RichTextView:<tag>).
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = project.group
                artifactId = 'RichTextView'
                version = project.version

                pom {
                    name = 'RichTextView for Android'
                    description = 'A TextView (and Jetpack Compose GapFillText) for filling in gaps in text.'
                    url = 'https://github.com/rayworks/RichTextView'
                    licenses {
                        license {
                            name = 'The Apache Software License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    scm {
                        connection = 'scm:git:https://github.com/rayworks/RichTextView.git'
                        url = 'https://github.com/rayworks/RichTextView'
                    }
                }
            }
        }
    }
}
